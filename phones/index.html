<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1d2129">
<title>Phone Label Scanner</title>
<script src="https://cdn.jsdelivr.net/npm/barcode-detector@3.2.2/dist/iife/ponyfill.js"></script>
<style>
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html, body { margin:0; height:100%; background:#000; color:#fff; font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; overflow:hidden; }
  header { position:fixed; top:0; left:0; right:0; z-index:5; background:#1d2129; padding:12px 16px; padding-top:max(12px, env(safe-area-inset-top)); display:flex; align-items:center; gap:12px; }
  header img { height:30px; width:auto; }
  header h1 { font-size:18px; margin:0; font-weight:700; }
  video { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; }
  /* Wide box: stripe barcodes are long and short, not square like a QR. */
  .frame { position:fixed; z-index:2; left:50%; top:34%; width:min(88vw, 420px); height:min(36vw, 170px); transform:translate(-50%, -50%);
           border-radius:14px; border:4px solid #ffd400; box-shadow:0 0 0 9999px rgba(0,0,0,.45); }
  .frame.hit { border-color:#2e9e5b; }
  .msg { position:fixed; z-index:3; left:16px; right:16px; top:calc(34% + min(18vw, 85px) + 14px); text-align:center; font-size:17px; font-weight:700; text-shadow:0 1px 4px rgba(0,0,0,.8); }
  .msg small { display:block; font-weight:400; font-size:14px; opacity:.85; margin-top:4px; }
  .sheet { position:fixed; z-index:4; left:0; right:0; bottom:0; max-height:44%; overflow-y:auto; background:#f4f5f7; color:#1d2129; border-radius:16px 16px 0 0;
           padding:14px 16px; padding-bottom:max(16px, env(safe-area-inset-bottom)); }
  .sheet .row { display:flex; gap:8px; margin-bottom:10px; }
  .sheet button { flex:1; padding:12px 8px; border-radius:10px; border:none; font-size:15px; font-weight:700; background:#2f3542; color:#fff; }
  .sheet button.on { background:#ffd400; color:#1d2129; }
  .sheet button.blue { background:#1a73e8; }
  .empty { color:#6b7280; text-align:center; padding:6px 0 10px; }
  .scan { background:#fff; border-radius:12px; padding:10px 12px; margin-bottom:8px; border-left:5px solid #9ca3af; }
  .scan.new { border-left-color:#2e9e5b; }
  .scan .val { font:600 17px/1.3 ui-monospace,Menlo,Consolas,monospace; word-break:break-all; }
  .scan .meta { font-size:13px; color:#4b5563; margin-top:3px; }
  .scan .guess { font-size:14px; font-weight:700; margin-top:3px; }
  .panel { position:fixed; z-index:6; inset:0; background:#f4f5f7; color:#1d2129; display:none; flex-direction:column; justify-content:center; align-items:center; padding:24px; text-align:center; }
  .panel.show { display:flex; }
  .panel h2 { margin:0 0 10px; font-size:22px; }
  .panel p { margin:0 0 18px; color:#4b5563; max-width:420px; }
  .panel button { display:block; width:100%; max-width:360px; padding:16px; border-radius:12px; border:none; font-size:17px; font-weight:700; margin-top:10px; background:#1a73e8; color:#fff; }
  .toast { position:fixed; z-index:7; left:50%; top:80px; transform:translateX(-50%); background:#2e9e5b; color:#fff; padding:10px 16px; border-radius:10px; font-weight:700; }
</style>
</head>
<body>
<header><img id="logo" alt="Ripple Distribution"><h1>Phone Label Scanner</h1></header>
<video id="video" playsinline muted autoplay></video>
<div class="frame" id="frame"></div>
<div class="msg" id="msg">Point at a barcode on the phone label<small>Line the stripes up inside the yellow box</small></div>
<div class="sheet">
  <div class="row">
    <button type="button" id="torch" hidden>Flashlight</button>
    <button type="button" class="blue" id="copy">Copy all</button>
    <button type="button" id="clear">Clear</button>
  </div>
  <div id="list"></div>
</div>
<div class="toast" id="toast" hidden></div>

<div class="panel" id="start">
  <h2>Scan a phone label</h2>
  <p>Your camera will open. Point it at any barcode on the new phone's label and it shows what's inside. Nothing is saved anywhere but this phone.</p>
  <button id="go" type="button">Open camera</button>
</div>

<div class="panel" id="fail">
  <h2 id="failTitle">Camera didn't open</h2>
  <p id="failText"></p>
  <button id="retry" type="button">Try again</button>
</div>

<script>
// Test scanner for the new MDM phones: reads any barcode on the label and shows
// exactly what it holds, so we can learn what the labels carry before wiring it
// into the Phones & Batteries hub. Scans stay in this phone's browser only.
const $ = id => document.getElementById(id);
const KEY = 'phoneLabelScans';
let stream = null, track = null, detector = null, busy = false, torchOn = false;
let scans = [], lastText = '', lastAt = 0;
const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });

try { scans = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { scans = []; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(scans)); } catch (e) {} }

function showPanel(id, on) { $(id).classList.toggle('show', !!on); }
function fail(title, text) {
  stop();
  $('failTitle').textContent = title; $('failText').textContent = text;
  showPanel('fail', true);
}

// IMEIs end in a check digit (Luhn), so a real one can be told apart from any 15 digits.
function luhn(d) {
  let sum = 0;
  for (let i = 0; i < d.length; i++) {
    let n = +d[d.length - 1 - i];
    if (i % 2) { n *= 2; if (n > 9) n -= 9; }
    sum += n;
  }
  return sum % 10 === 0;
}

function guess(raw) {
  const t = String(raw).trim(), d = t.replace(/\D/g, '');
  if (/^https?:/i.test(t)) return 'A web link';
  if (/^\d+$/.test(t)) {
    if (t.length === 15 && luhn(t)) return 'IMEI (phone ID)';
    if (t.length === 15) return '15 digits, but not a valid IMEI';
    if (t.length === 14) return 'Maybe an MEID (older phone ID)';
    if ((t.length === 19 || t.length === 20) && t.startsWith('89')) return 'SIM card number (ICCID)';
    if (t.length === 10 || (t.length === 11 && t[0] === '1')) return 'Maybe a phone number';
    if (t.length === 12 || t.length === 13) return 'Maybe a product code (UPC/EAN)';
    return t.length + ' digits, not sure what it is';
  }
  if (/IMEI|SN|S\/N|SERIAL|ICCID/i.test(t) && t.length > 20) return 'Several details in one code';
  if (/^[A-Z0-9]{8,14}$/i.test(t) && /[A-Z]/i.test(t) && /\d/.test(t)) return 'Probably a serial number';
  if (/^R?\d{1,3}$/i.test(t)) return 'Probably the phone\'s label number';
  return d.length ? 'Not sure, send it to Claude' : 'Text, not sure what it is';
}

function render() {
  const box = $('list');
  if (!scans.length) { box.innerHTML = '<div class="empty">Nothing scanned yet.</div>'; return; }
  box.innerHTML = '';
  scans.slice().reverse().forEach((s, i) => {
    const el = document.createElement('div');
    el.className = 'scan' + (i === 0 ? ' new' : '');
    const val = document.createElement('div'); val.className = 'val'; val.textContent = s.text;
    const g = document.createElement('div'); g.className = 'guess'; g.textContent = guess(s.text);
    const m = document.createElement('div'); m.className = 'meta';
    m.textContent = s.format + ' · ' + s.text.length + ' characters · ' + new Date(s.at).toLocaleTimeString([], { hour:'numeric', minute:'2-digit' });
    el.append(val, g, m);
    box.append(el);
  });
}

function toast(t) {
  $('toast').textContent = t; $('toast').hidden = false;
  clearTimeout(toast.h); toast.h = setTimeout(() => { $('toast').hidden = true; }, 1600);
}

async function start() {
  showPanel('start', false); showPanel('fail', false);
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    return fail("This browser can't scan", 'Open this link in Safari (iPhone) or Chrome (Android).');
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }
    });
  } catch (e) {
    const denied = e && (e.name === 'NotAllowedError' || e.name === 'SecurityError');
    return fail(denied ? 'Camera is blocked' : "Camera didn't open",
      denied ? 'Allow camera access for this page (tap the "aA" or lock icon in the address bar → Camera → Allow), then tap Try again.'
             : 'Close other apps using the camera and tap Try again. ' + (e && e.message ? '(' + e.message + ')' : ''));
  }
  track = stream.getVideoTracks()[0];
  const v = $('video'); v.srcObject = stream;
  try { await v.play(); } catch (e) {}
  try {
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    if (caps.torch) $('torch').hidden = false;
    if (caps.focusMode && caps.focusMode.includes('continuous')) track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});
  } catch (e) {}
  // Android Chrome has a built-in reader; iPhone uses zxing-cpp (same API), which also
  // reads the angled, leaning labels the old JS reader missed.
  if (!detector && 'BarcodeDetector' in window) {
    try {
      const fmts = await BarcodeDetector.getSupportedFormats();
      if (fmts.includes('code_128')) detector = new BarcodeDetector({ formats: fmts });
    } catch (e) {}
  }
  if (!detector && window.BarcodeDetectionAPI) {
    detector = new BarcodeDetectionAPI.BarcodeDetector({ formats: ['code_128', 'code_39', 'code_93', 'ean_13', 'ean_8',
      'upc_a', 'upc_e', 'itf', 'codabar', 'qr_code', 'data_matrix', 'pdf417', 'aztec'] });
  }
  if (!detector) return fail("Scanner didn't load", 'Check the internet connection and tap Try again.');
  loop();
}

function stop() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null; track = null;
}

// Read the area inside the yellow box a few times a second; keep scanning after a hit
// so a whole box of phones can be scanned in a row.
async function loop() {
  if (!stream) return;
  const v = $('video');
  if (!busy && v.readyState >= 2 && v.videoWidth) {
    busy = true;
    try {
      const hit = await readFrame(v);
      if (hit) found(hit);
    } catch (e) {}
    busy = false;
  }
  setTimeout(loop, 150);
}

async function readFrame(v) {
  // Map the yellow box on screen back onto the camera picture (the video is
  // cropped to fill the screen), with a little extra around it.
  const vw = v.videoWidth, vh = v.videoHeight;
  const k = Math.max(innerWidth / vw, innerHeight / vh);
  const ox = (vw * k - innerWidth) / 2, oy = (vh * k - innerHeight) / 2;
  const fr = $('frame').getBoundingClientRect(), pad = 24;
  const sx = Math.max(0, Math.round((fr.left - pad + ox) / k)), sy = Math.max(0, Math.round((fr.top - pad + oy) / k));
  const w = Math.min(vw - sx, Math.round((fr.width + 2 * pad) / k)), h = Math.min(vh - sy, Math.round((fr.height + 2 * pad) / k));
  const scale = Math.min(1, 1280 / w);
  canvas.width = Math.round(w * scale); canvas.height = Math.round(h * scale);
  ctx.drawImage(v, sx, sy, w, h, 0, 0, canvas.width, canvas.height);
  const hits = await detector.detect(canvas);
  return hits.length && hits[0].rawValue ? { text: hits[0].rawValue, format: hits[0].format } : null;
}

function found(hit) {
  const text = String(hit.text).trim(), now = Date.now();
  // Same code still in view: don't log it again.
  if (text === lastText && now - lastAt < 4000) { lastAt = now; return; }
  lastText = text; lastAt = now;
  const format = String(hit.format || '').replace(/_/g, ' ').toUpperCase();
  const dup = scans.some(s => s.text === text);
  scans.push({ text, format, at: now });
  save(); render();
  $('frame').classList.add('hit');
  setTimeout(() => $('frame').classList.remove('hit'), 700);
  toast(dup ? 'Scanned again' : 'Got it');
  if (navigator.vibrate) navigator.vibrate(80);
}

$('copy').addEventListener('click', async () => {
  if (!scans.length) return toast('Nothing to copy yet');
  const out = scans.map(s => s.text + '  [' + s.format + ' · ' + guess(s.text) + ']').join('\n');
  try { await navigator.clipboard.writeText(out); toast('Copied ' + scans.length + ' scan' + (scans.length === 1 ? '' : 's')); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = out; document.body.append(ta); ta.select();
    try { document.execCommand('copy'); toast('Copied'); } catch (e2) { toast("Couldn't copy"); }
    ta.remove();
  }
});
$('clear').addEventListener('click', () => {
  if (!scans.length) return;
  if ($('clear').dataset.sure !== '1') {
    $('clear').dataset.sure = '1'; $('clear').textContent = 'Tap again to clear';
    setTimeout(() => { $('clear').dataset.sure = ''; $('clear').textContent = 'Clear'; }, 3000);
    return;
  }
  scans = []; save(); render(); $('clear').dataset.sure = ''; $('clear').textContent = 'Clear';
});
$('torch').addEventListener('click', async () => {
  if (!track) return;
  torchOn = !torchOn;
  try { await track.applyConstraints({ advanced: [{ torch: torchOn }] }); } catch (e) { torchOn = false; }
  $('torch').classList.toggle('on', torchOn);
});
$('go').addEventListener('click', start);
$('retry').addEventListener('click', start);

window.addEventListener('pageshow', e => { if (e.persisted) location.reload(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) stop();
  else if (!stream && !$('start').classList.contains('show') && !$('fail').classList.contains('show')) start();
});

render();
(async () => {
  try {
    const p = navigator.permissions && await navigator.permissions.query({ name: 'camera' });
    if (p && p.state === 'granted') return start();
  } catch (e) {}
  showPanel('start', true);
})();
</script>
